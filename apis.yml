name: TripScout
description: TripScout is a travel media and deals company that curates flight and hotel
  recommendations for consumers and operates a portfolio of large travel-focused social
  brands (including the @hotel property at athotel.com). Its core product scans millions
  of flights weekly and emails subscribers a small set of vetted deals, each paired with
  featured, splurge, and budget hotel options plus destination context such as weather,
  festivals, and local activities. TripScout runs a free tier (one deal per week) and a
  premium subscription. It is a consumer-facing, email- and social-first business and does
  not currently publish a public developer API, documentation portal, or SDKs. Backed by
  500 Global; added to the API Evangelist network as a portfolio lead.
